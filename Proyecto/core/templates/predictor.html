{% extends "body.html" %}
{% load static %}
{% block title %}Estimar cosecha · AgroAsesor{% endblock %}
{% block extra_css %}<link rel="stylesheet" href="{% static 'css/predictor.css' %}">{% endblock %}
{% block content %}
<h1 class="page-title">Estimar cosecha</h1>
<p class="page-sub">Estimación demostrativa basada en datos históricos de referencia.</p>
<form class="card grid-2" id="predict-form">
    <label class="field"><span>Cultivo</span><select id="crop"></select></label>
    <label class="field"><span>Variedad</span><input id="variety" value="Híbrido demo"></label>
    <label class="field"><span>Zona</span><select id="zone"></select></label>
    <label class="field"><span>Superficie (ha)</span><input id="area" type="number" min="0.01" step="0.01" required></label>
    <label class="field"><span>Temporada</span><select id="season"><option>2026-2027</option><option>2025-2026</option></select></label>
    <p class="error" id="predict-error"></p>
    <button class="button" type="submit">Estimar cosecha</button>
</form>
<section class="card" id="predict-result" hidden></section>
{% endblock %}
{% block extra_js %}<script src="{% static 'js/predictor.js' %}"></script>{% endblock %}
